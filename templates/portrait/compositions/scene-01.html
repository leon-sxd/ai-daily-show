<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #13161b;
          color: #f2f4f7;
          font-family: system-ui, sans-serif;
        }
        .kicker {
          position: absolute;
          left: 96px;
          top: 270px;
          font-size: 26px;
          letter-spacing: 6px;
          color: #e0a45c;
          font-weight: 600;
        }
        .text {
          position: absolute;
          left: 96px;
          top: 350px;
          width: 844px;
        }
        h1 {
          font-size: 62px;
          line-height: 1.22;
          font-weight: 800;
          letter-spacing: 1px;
        }
        .lead {
          margin-top: 28px;
          font-size: 30px;
          line-height: 1.55;
          color: #c2cad4;
        }
        .rule {
          width: 76px;
          height: 4px;
          border-radius: 2px;
          background: #e0a45c;
          margin-top: 28px;
        }
        .stage {
          position: absolute;
          left: 96px;
          top: 780px;
          width: 844px;
          height: 560px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(4, 190px);
          grid-template-rows: repeat(3, 140px);
          gap: 18px;
        }
        .cell {
          border: 1px solid rgba(242, 244, 247, 0.1);
          border-radius: 8px;
          background: rgba(242, 244, 247, 0.025);
          position: relative;
        }
        .dot {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 30px;
          height: 30px;
          margin: -15px 0 0 -15px;
          border-radius: 50%;
          background: #e0a45c;
          box-shadow: 0 0 24px rgba(224, 164, 92, 0.55);
        }
        .tagline {
          position: absolute;
          left: 96px;
          bottom: 500px;
          font-size: 28px;
          letter-spacing: 1px;
          color: #c2cad4;
        }
      </style>

      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div class="kicker" id="s1-kicker">AI 日报 · YYYY.MM.DD</div>

        <div class="text">
          <h1 id="s1-title">今天，AI 圈又有新动作</h1>
          <p class="lead" id="s1-lead">六条热点，加一个概念拆解，90 秒讲清</p>
          <div class="rule" id="s1-rule"></div>
        </div>

        <div class="stage" id="s1-stage">
          <div class="grid">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"><div class="dot" id="s1-dot"></div></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
          </div>
        </div>

        <div class="tagline" id="s1-tag">先看今天最值得知道的事</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#s1-kicker", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.25);
          tl.fromTo("#s1-title", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.55);
          tl.fromTo("#s1-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.95);
          tl.fromTo("#s1-lead", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.95);
          tl.fromTo(".cell", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.06 }, 1.15);
          tl.fromTo("#s1-dot", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.95);
          tl.fromTo("#s1-tag", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.25);
          tl.to("#s1-stage", { scale: 1.03, duration: 2.2, ease: "sine.inOut" }, 3.6);
          tl.to("#s1-stage", { scale: 1, duration: 2.0, ease: "sine.inOut" }, 5.8);
          window.__timelines["s1"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
